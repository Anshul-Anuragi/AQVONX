services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aqvonx-backend:latest
    container_name: aqvonx-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
    networks:
      - aqvonx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    image: aqvonx-frontend:latest
    container_name: aqvonx-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - aqvonx-network

networks:
  aqvonx-network:
    driver: bridge
